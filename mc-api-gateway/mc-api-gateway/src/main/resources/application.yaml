server:
  port: 8080

spring:
  application:
    name: mc-api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: mc-artistas
            uri: http://localhost:8088
            predicates:
              - Path=/api/v1/artistas/**

          - id: mc-devoluciones
            uri: http://localhost:8094
            predicates:
              - Path=/devoluciones/**

          - id: mc-evento
            uri: http://localhost:8081
            predicates:
              - Path=/evento/**

          - id: mc-preventa
            uri: http://localhost:8086
            predicates:
              - Path=/preventa/**

          - id: mc-promotores
            uri: http://localhost:8090
            predicates:
              - Path=/api/v1/promotores/**

          - id: mc-recintos
            uri: http://localhost:8082
            predicates:
              - Path=/recinto/**

          - id: mc-streaming
            uri: http://localhost:8095
            predicates:
              - Path=/api/v1/streaming/**

          - id: mc-tickets
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/tickets/**

          - id: mc-validacion
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/validaciones/**

          - id: mc-ventas
            uri: http://localhost:8091
            predicates:
              - Path=/ventas/**
              
