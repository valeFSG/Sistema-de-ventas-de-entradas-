spring.application.name=eventos

server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/eventosdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Habilitar Flyway

spring.flyway.enabled=true

# Ruta donde buscarás los scripts SQL

spring.flyway.locations=classpath:db/migration

# Importante si ya tienes datos en la BD y no quieres empezar de cero

spring.flyway.baseline-on-migrate=true

logging.file.name=logs/app-dev.json
# 2. Activa el formato JSON estructurado nativo para el archivo
logging.structured.format.file=logstash
# 3. (Opcional) Si también quieres que la consola de tu IDE muestre JSON
logging.structured.format.console=logstash